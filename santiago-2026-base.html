havior:'smooth'});bar.style.transform=`scaleX(${cur+1})`;prev.disabled=cur===0;next.disabled=cur===D.length-1;if(hash)history.replaceState(null,'','#'+D[cur].id)}nav.onclick=e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)};track.onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)};prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);onkeydown=e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)};let sx=0,sy=0;track.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});track.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)go(cur+(dx<0?1:-1))},{passive:true});onhashchange=()=>{const i=D.findIndex(x=>x.id===location.hash.slice(1));if(i>=0)go(i,false)};const start=D.findIndex(x=>x.id===location.hash.slice(1));go(start>=0?start:0,false);</script></body></html>
